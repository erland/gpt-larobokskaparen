schema_version: 1
project:
  id: larobokskaparen
  name: Lärobokskaparen
  profile: zip_first_advanced
  orchestration: stateful
  language: sv
  description: Skapar och kvalitetssäkrar läroböcker och faktaböcker med revisionssäkra
    bokprojekt och EPUB/PDF-export.
instructions:
  canonical: canonical/core.md
  core_contract:
    enabled: true
    required_markers:
    - Gemensamma arbetsprinciper
    required_runtime_dependencies: []
    max_required_file_hops: 1
    knowledge_may_not_be_required_for_core_behavior: true
  mode: modular_skills
  core: canonical/core.md
  legacy_source: canonical/legacy-instructions.md
knowledge_architecture:
  canonical_root: knowledge-upload
  template_source_of_truth: templates/bokprojekt
  generated_template_bundle: knowledge-upload/19-project-template-bundle.md
capabilities:
  contract_version: 1
  schema: schemas/capability-contract.schema.json
  recommendation_mode: inferred_from_use_case
  ask_user_only_when_business_choice_is_ambiguous: true
  requirements:
    web:
      level: recommended
      reason: Färsk verifiering behövs för aktuella, externa eller lätt föränderliga
        fakta.
    filesystem:
      read: required
      write: required
    shell:
      level: recommended
      reason: Projektintegritet, validering och lokal EPUB/PDF-export använder deterministiska
        scripts.
    code_execution:
      level: required
      reason: Stateful ZIP-/workspace-flöde och projektverktyg behöver exekvering
        för full funktion.
    structured_data:
      level: required
      reason: book.yaml, project-manifest.json och projektstatus är bärande kontrakt.
    persistent_state:
      level: required
      reason: Bokprojektet är långlivat och måste kunna återupptas utan att chatthistorik
        är enda sanningskälla.
    external_tools:
      level: optional
      reason: Kärnflödet ska inte kräva leverantörsspecifika externa integrationer.
      preferred_protocols:
      - mcp
    image_generation:
      level: optional
      reason: Omslag och inre illustrationer används endast när användaren vill ha
        dem.
artifacts:
  contract_version: 1
  schema: schemas/artifact-contract.schema.json
  outputs:
    book_project_zip:
      kind: package
      format: zip
      requirement: conditional
      condition: project_created_or_modified
      persistence: persistent
      multiplicity: one
      description: Komplett bokprojekt med canonical metadata, manifest, revision
        och alla projektfiler.
    project_status:
      kind: metadata
      format: markdown
      requirement: conditional
      condition: stateful_project_work
      persistence: persistent
      multiplicity: one
      description: Projektstatus för det genererade bokprojektet.
    project_manifest:
      kind: metadata
      format: json
      requirement: conditional
      condition: stateful_project_work
      persistence: persistent
      multiplicity: one
      description: Integritets- och revisionsmanifest för bokprojektet.
    epub:
      kind: document
      format: epub
      requirement: conditional
      condition: export_requested
      persistence: persistent
      multiplicity: one
      description: Publicerbar EPUB byggd från canonical bokprojekt.
    pdf:
      kind: document
      format: pdf
      requirement: conditional
      condition: export_requested
      persistence: persistent
      multiplicity: one
      description: Publicerbar PDF byggd från canonical bokprojekt.
    cover_image:
      kind: document
      format: image
      requirement: optional
      persistence: persistent
      multiplicity: one
      description: Omslagsbild när användaren har valt att skapa en sådan.
workspace_state:
  contract_version: 1
  schema: schemas/workspace-state-contract.schema.json
  workspace:
    requirement: required
    persistence: required
    portable: true
    separate_from_assistant: true
    artifact: book_project_zip
    description: Bokprojektets filer är den långlivade arbetsytan och ska kunna flyttas
      mellan runtimes.
  state:
    requirement: required
    persistence: required
    authority: workspace_file
    format: json
    path: templates/bokprojekt/project-manifest.json
    conversation_fallback: false
    description: project-manifest.json tillsammans med book.yaml och revision-loggen
      är auktoritativt projekttillstånd.
  runtime_preferences:
    chat: workspace_file
    agent: workspace_file
tools:
  contract_version: 1
  schema: schemas/tool-contract.schema.json
  tools:
  - id: project-integrity
    type: script
    requirement: required
    purpose: Initiera, verifiera och versionssäkra genererade bokprojekt.
    script: templates/bokprojekt/scripts/project_integrity.py
    deterministic: true
    mutates_workspace: true
    working_directory: workspace
    runtime_fallback: block
  - id: project-validation
    type: script
    requirement: required
    purpose: Validera bokprojektets metadata, kapitel, bilder och integritet.
    script: templates/bokprojekt/scripts/validate_project.py
    deterministic: true
    mutates_workspace: false
    working_directory: workspace
    runtime_fallback: block
  - id: diagram-render
    type: script
    requirement: optional
    purpose: Rendera Graphviz/PlantUML/egen SVG till kontrollerad SVG när användaren vill ha diagram.
    script: templates/bokprojekt/scripts/render_diagrams.py
    deterministic: true
    mutates_workspace: true
    working_directory: workspace
    runtime_fallback: manual
  - id: chapter-review
    type: script
    requirement: optional
    purpose: Versionsbind och verifiera kapitelgranskning och godkännande.
    script: templates/bokprojekt/scripts/chapter_review.py
    deterministic: true
    mutates_workspace: true
    working_directory: workspace
    runtime_fallback: manual
  - id: book-export
    type: script
    requirement: recommended
    purpose: Exportera bokprojekt till EPUB och PDF när nödvändiga lokala verktyg
      finns.
    script: templates/bokprojekt/scripts/export-book.py
    deterministic: true
    mutates_workspace: true
    working_directory: workspace
    runtime_fallback: manual
  - id: book-build
    type: script
    requirement: recommended
    purpose: Köra validering och bygga EPUB/PDF samt checksummor.
    script: templates/bokprojekt/scripts/build_book.py
    deterministic: true
    mutates_workspace: true
    working_directory: workspace
    runtime_fallback: manual
runtime:
  primary: none
  chat_zip:
    enabled: true
    role: peer_distribution
    allow_richer_runtime_than_custom_gpt: true
    entrypoint: START-HERE.md
    schema: schemas/chat-zip-runtime.schema.json
    start_here_template: templates/START-HERE.chat.md.tpl
    layout:
      assistant: assistant
      knowledge: knowledge
      schemas: schemas
      scripts: scripts
      templates: templates
      runtime: runtime
    include:
      instructions:
      - canonical/core.md
      - canonical/skills/**/behavior.md
      policies: []
      conversation_starters:
      - gpt-configuration/conversation-starters.md
      knowledge:
      - knowledge-upload/**
      schemas:
      - schemas/**
      scripts:
      - templates/bokprojekt/scripts/**
      templates:
      - templates/bokprojekt/**
    exclude:
    - docs/**
    - tests/**
    - evals/**
    - research/**
    - .github/**
    - .git/**
    - build/**
    - dist/**
    - project-status.yaml
    - PROJECT.md
    - STATUS.md
    manifest:
      required: true
      checksums: true
    deterministic_build: true
    omit_empty_runtime_directories: true
  claude:
    enabled: true
    role: peer_distribution
    mode: claude_project
    schema: schemas/claude-portable-runtime.schema.json
    project:
      instructions: project/instructions.md
      knowledge: project/knowledge
      runtime_contract: project/runtime-contract.json
    templates:
      readme: templates/README.claude.md.tpl
    validation:
      require_instructions: true
      require_runtime_contract: true
  opencode:
    enabled: true
    role: peer_distribution
    mode: opencode_workspace
    schema: schemas/opencode-runtime.schema.json
    layout:
      instructions: AGENTS.md
      config: opencode.json
      tools: .opencode/tools
      runtime_scripts: scripts
      runtime_contract: .opencode/runtime-contract.json
      knowledge: knowledge
    templates:
      readme: templates/README.opencode.md.tpl
    skills:
      enabled: true
      directory: .opencode/skills
      definitions:
      - id: bokplanering
        name: bokplanering
        description: Välj bokprofil och utforma en godkännbar plan för en lärobok
          eller faktabok.
      - id: bokskrivande
        name: bokskrivande
        description: Skriv och granska bokkapitel, källor och illustrationer.
      - id: diagram-illustrationer
        name: diagram-illustrationer
        description: Skapa och underhåll Graphviz-, PlantUML- och SVG-illustrationer.
      - id: bokprojekt-publicering
        name: bokprojekt-publicering
        description: Hantera projektmanifest, revision, ZIP och export till EPUB/PDF.
    validation:
      require_agents_md: true
      require_runtime_contract: true
  plugin:
    enabled: true
    role: peer_distribution
    mode: openai_plugin
    schema: schemas/plugin-runtime.schema.json
    layout:
      manifest_file: plugin.json
      skills: skills
      references: references
      assets: assets
      scripts: scripts
    templates:
      readme: templates/README.plugin.md.tpl
    validation:
      require_manifest: true
      require_skill: true
      require_skill_frontmatter: true
  custom_gpt:
    enabled: false
    role: peer_distribution
    compilation_mode: adaptive
    allow_reduced_functionality: true
    platform_limits:
      instruction_max_characters: 8000
      knowledge_max_files: 20
    notes:
    - Platform limits are configuration values and must be easy to update.
    - Custom GPT and Chat ZIP are peer distribution targets derived from the same
      canonical contract.
    schema: schemas/custom-gpt-compilation.schema.json
    instruction:
      mode: compressed
      max_characters: 8000
    knowledge:
      strategy: hybrid
      max_files: 20
    builder:
      instructions: builder/instructions.md
      conversation_starters: builder/conversation-starters.md
      capabilities: builder/capabilities.md
      runtime_contract: builder/runtime-contract.json
      knowledge_package: builder/knowledge-package
    templates:
      readme: templates/README.custom-gpt.md.tpl
      compatibility: templates/COMPATIBILITY.md.tpl
      capabilities: templates/capabilities.md.tpl
    compatibility:
      report_required: true
      parity_symbols:
        equivalent: ✓
        reduced: '~'
        missing: '-'
    validation:
      block_on_instruction_limit: true
      block_on_knowledge_limit: true
      block_on_misleading_core_functionality: true
build_system:
  build_script: scripts/build_distributions.py
  validation_script: scripts/validate_distributions.py
  targets:
  - project
  - chat
  - claude_project
  - claude_skills
  - opencode
  - plugin
  runtime_targets:
    chat:
      runtime_id: chatgpt_chat
      runtime_key: chat_zip
      builder: chat
      artifact_type: chat_zip
      filename_pattern: <project-id>-chat-<version>.zip
    claude_project:
      runtime_id: claude_project
      runtime_key: claude
      builder: claude
      artifact_type: claude_project_zip
      filename_pattern: <project-id>-claude-project-<version>.zip
    claude_skills:
      runtime_id: claude_skills
      runtime_key: claude
      builder: claude_skills
      artifact_type: claude_skills_zip
      filename_pattern: <project-id>-claude-skills-<version>.zip
    opencode:
      runtime_id: opencode
      runtime_key: opencode
      builder: opencode
      artifact_type: opencode_zip
      filename_pattern: <project-id>-opencode-<version>.zip
    plugin:
      runtime_id: openai_plugin
      runtime_key: plugin
      builder: plugin
      artifact_type: plugin_zip
      filename_pattern: <project-id>-plugin-<version>.zip
  output_root: dist
  working_root: build
  deterministic_zip: true
  manifest: true
  checksums: sha256
  project_zip_excludes:
  - build/**
  - dist/**
  - .git/**
  - '**/__pycache__/**'
  - '**/.pytest_cache/**'
  engine_version: 1.6.26
  engine_source: pinned-original
testing:
  distribution_validation: scripts/validate_distributions.py
  project_validation: templates/bokprojekt/scripts/validate_project.py
  project_integrity: templates/bokprojekt/scripts/project_integrity.py
ci:
  enabled: true
  workflow: .github/workflows/build-distributions.yml
release:
  github:
    optional: true
    version_source: github_release_tag
    tag_pattern: v{semver}
    build_on_published_release: true
    workflow: .github/workflows/build-distributions.yml
    trigger: release.published
    permissions:
    - contents:write
    run_tests: true
    run_distribution_validation: true
    upload_artifacts_to_release: true
    artifacts:
    - project_zip
    - chat_zip
    - claude_project_zip_when_enabled
    - claude_skills_zip_when_enabled
    - opencode_zip_when_enabled
    - plugin_zip_when_enabled
    - checksums
    - delivery_manifest
    enabled: true
    default: true
  local:
    supported: true
    version_strategy_before_github_release: development_version
migration:
  target_builder_version: 1.6.26
  strategy: behavior_preserving
  original_instruction: gpt-configuration/instructions.md
  distribution_count: 5
  review: modular skills regrouped; original complete instruction preserved
skills:
  contract_version: 1
  schema: schemas/skill-contract.schema.json
  mode: explicit
  definitions:
  - id: bokplanering
    name: Bokplanering
    description: Välj bokprofil och utforma en godkännbar plan för en lärobok eller
      faktabok.
    source: canonical/skills/bokplanering/behavior.md
    references:
    - knowledge-upload/01-purpose-and-workflow.md
    scripts: []
  - id: bokskrivande
    name: Bokskrivande och faktakontroll
    description: Skriv och granska bokkapitel, källor och illustrationer.
    source: canonical/skills/bokskrivande/behavior.md
    references:
    - knowledge-upload/01-purpose-and-workflow.md
    scripts: []
  - id: diagram-illustrationer
    name: Diagram och tekniska illustrationer
    description: Välj verktyg, förvalta diagramkällor och rendera SVG för bokprojekt.
    source: canonical/skills/diagram-illustrationer/behavior.md
    references:
    - knowledge-upload/20-code-generated-diagrams.md
    scripts:
    - templates/bokprojekt/scripts/render_diagrams.py
    assets: []
  - id: bokprojekt-publicering
    name: Bokprojekt, revision och publicering
    description: Hantera projektmanifest, revision, ZIP och export till EPUB/PDF.
    source: canonical/skills/bokprojekt-publicering/behavior.md
    references:
    - knowledge-upload/18-local-export-pipeline.md
    assets:
    - knowledge-upload/19-project-template-bundle.md
    scripts:
    - templates/bokprojekt/scripts/project_integrity.py
    - templates/bokprojekt/scripts/validate_project.py
    - templates/bokprojekt/scripts/export-book.py
    - templates/bokprojekt/scripts/chapter_review.py
    - templates/bokprojekt/scripts/build_book.py
build:
  deterministic: true
  create_manifest: true
  create_checksums: true
  build_project_zip: true
  build_chat_zip: true
  build_custom_gpt_zip: false
  build_claude_project_zip: true
  build_claude_skills_zip: true
  build_opencode_zip: true
  build_plugin_zip: true
  direct_downloads_without_github: true
development:
  plan: docs/development-plan.md
  status: project-status.yaml
  human_readable_status: STATUS.md
  status_schema: schemas/project-status.schema.json
  project_documentation:
  - PROJECT.md
  - docs/product-vision.md
  - docs/user-journeys.md
  - docs/canonical-project-structure.md
structure:
  canonical_root: src
  instructions:
    path: canonical
    required: true
  conversation_starters:
    path: gpt-configuration
    required: true
  runtime_policy:
    path: canonical
    required: false
  knowledge:
    path: knowledge
    required: false
  templates:
    path: templates
    required: false
  schemas:
    path: schemas
    required: false
  scripts:
    path: scripts
    required: false
  tests:
    path: tests
    required: false
  evals:
    path: evals
    required: false
  research:
    path: research
    required: false
  build:
    path: build
    generated: true
    create_when_needed: true
  dist:
    path: dist
    generated: true
    create_when_needed: true

engine:
  enabled: true
  resources:
  - templates/bokprojekt
  - .engine-deps/plantuml.jar
  - docs/ENGINE.md
  selftest: scripts/engine_selftest.py
  required_files:
  - templates/bokprojekt/scripts/export-book.py
  - templates/bokprojekt/scripts/render_diagrams.py
  - templates/bokprojekt/scripts/project_integrity.py
  - .engine-deps/plantuml.jar
  python_dependencies: []
