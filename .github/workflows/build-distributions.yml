name: Build distributions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag='${{ github.event.release.tag_name }}'
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release-taggen måste följa v<SemVer>, t.ex. v1.1.0. Fick: $tag" >&2
              exit 1
            fi
            version="${tag#v}"
          else
            version="$(tr -d '[:space:]' < VERSION)"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "VERSION måste vara SemVer, t.ex. 1.0.0. Fick: $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Byggversion: $version"

      - name: Build distributions
        run: python3 scripts/build_distributions.py --version "${{ steps.version.outputs.version }}"

      - name: Validate distributions
        run: python3 scripts/validate_distributions.py --version "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: larobokskaparen-distributions-v${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach ZIP files to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
