name: Build distributions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer for a manual development build (for example 1.4.0-dev.1)"
        required: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag='${{ github.event.release.tag_name }}'
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Release-taggen måste vara v<SemVer>" >&2; exit 1; }
            version="${tag#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n '${{ inputs.version }}' ]]; then
            version='${{ inputs.version }}'
          else
            version="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build distributions
        run: python3 scripts/build_distributions.py --version "${{ steps.version.outputs.version }}"
      - name: Validate distributions
        run: python3 scripts/validate_distributions.py --version "${{ steps.version.outputs.version }}"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: larobokskaparen-distributions-v${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Attach ZIP files to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
